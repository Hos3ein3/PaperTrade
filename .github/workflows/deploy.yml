name: Deploy Angular to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_DIR: "/home/homelabadmin/wwwroot/azuretest/frontend"

jobs:
  build-and-deploy-frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync Source Code
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -av --delete \
            --exclude '.git' --exclude 'node_modules/' \
            --exclude 'dist/' --exclude '.angular/' \
            ./ "$DEPLOY_DIR"/

      - name: Build and Start
        run: |
          cd "$DEPLOY_DIR"
          docker compose build
          docker compose up -d --remove-orphans

      - name: Health Check
        run: |
          end=$((SECONDS+90))
          while [ $SECONDS -lt $end ]; do
            if curl -fs http://localhost:8090/healthz > /dev/null; then
              echo "Frontend is healthy."
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 azuretest-frontend
          exit 1
