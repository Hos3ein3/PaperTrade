@if (isOpen()) {
  <div class="fixed inset-0 z-50 overflow-hidden">
    <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm transition-opacity" (click)="closed.emit()"></div>

    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-white/95 dark:bg-slate-900/90 text-slate-800 dark:text-white backdrop-blur-2xl border-l border-slate-200/90 dark:border-white/10 shadow-2xl p-6 flex flex-col justify-between">
        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-200/80 dark:border-white/10">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-bell text-brand-500"></i>
            <h3 class="text-base font-bold text-slate-900 dark:text-white">Notifications</h3>
            @if (unreadCount() > 0) {
              <span class="px-2 py-0.5 rounded-full text-xs bg-brand-500/20 text-brand-700 dark:text-brand-300 font-bold font-mono">
                {{ unreadCount() }}
              </span>
            }
          </div>

          <div class="flex items-center gap-1.5">
            <!-- Delete Read Notifications Button -->
            <button
              type="button"
              (click)="deleteRead()"
              class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 dark:bg-rose-950/30 dark:hover:bg-rose-900/40 dark:text-rose-300 dark:border-rose-900/40 text-xs font-semibold transition-colors flex items-center gap-1 cursor-pointer"
              title="Delete all read notifications"
            >
              <i class="fa-solid fa-trash-can text-[10px]"></i>
              <span>Clear Read</span>
            </button>

            <button
              type="button"
              (click)="sendTest()"
              class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 dark:bg-white/5 dark:hover:bg-white/10 dark:text-slate-300 dark:border-white/10 text-xs font-semibold transition-colors cursor-pointer"
            >
              Test Alert
            </button>
            <button
              type="button"
              (click)="closed.emit()"
              class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white cursor-pointer"
            >
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>
        </div>

        <!-- List -->
        <div class="flex-1 overflow-y-auto py-4 space-y-3">
          @for (n of notifications(); track n.id) {
            <div
              class="p-3.5 rounded-xl border transition-all relative group"
              [ngClass]="n.isRead ? 'bg-slate-100/70 border-slate-200/80 dark:bg-white/5 dark:border-white/5 opacity-80' : 'bg-brand-500/10 border-brand-500/30 shadow-sm'"
            >
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-center gap-1.5">
                  @if (!n.isRead) {
                    <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                  }
                  <h4 class="text-xs font-bold text-slate-900 dark:text-white">{{ n.title }}</h4>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] text-slate-500 dark:text-slate-400 shrink-0 font-mono">{{ n.createdAt | date:'shortTime' }}</span>
                  <!-- Individual Delete Button for Read Notification -->
                  @if (n.isRead) {
                    <button
                      type="button"
                      (click)="deleteNotification(n.id)"
                      class="text-slate-400 hover:text-rose-500 p-0.5 transition-colors cursor-pointer"
                      title="Delete notification"
                    >
                      <i class="fa-solid fa-trash text-[10px]"></i>
                    </button>
                  }
                </div>
              </div>
              <p class="text-xs text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">{{ n.message }}</p>
            </div>
          } @empty {
            <div class="py-12 text-center text-xs text-slate-500 dark:text-slate-400">
              <i class="fa-solid fa-bell-slash text-2xl text-slate-400 dark:text-slate-600 block mb-2"></i>
              No new notifications.
            </div>
          }
        </div>

        <!-- Footer -->
        <div class="pt-4 border-t border-slate-200/80 dark:border-white/10 flex justify-between items-center">
          <button
            type="button"
            (click)="markAllRead()"
            class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-500 cursor-pointer"
          >
            Mark all as read
          </button>
          <button
            type="button"
            (click)="closed.emit()"
            class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 dark:bg-white/10 dark:hover:bg-white/15 dark:text-white dark:border-transparent text-xs font-bold cursor-pointer"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
}
