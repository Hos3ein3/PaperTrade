<app-glass-modal
  [isOpen]="isOpen()"
  [title]="'Modify ' + (position()?.symbol || '') + ' Risk Targets'"
  subtitle="Adjust Stop Loss and Take Profit levels on this active position."
  icon="fa-solid fa-sliders"
  (closed)="closed.emit()"
>
  @if (position()) {
    <div class="space-y-4">
      <!-- Position Header Info -->
      <div class="grid grid-cols-3 gap-2 p-3 rounded-xl bg-slate-100/90 dark:bg-white/5 border border-slate-200/80 dark:border-white/10 text-xs font-mono">
        <div>
          <span class="text-slate-600 dark:text-slate-400 block text-[10px] font-semibold">ENTRY PRICE</span>
          <span class="text-slate-900 dark:text-white font-bold">\${{ position()!.entryPrice | number:'1.2-4' }}</span>
        </div>
        <div>
          <span class="text-slate-600 dark:text-slate-400 block text-[10px] font-semibold">CURRENT MARK</span>
          <span class="text-slate-900 dark:text-white font-bold">\${{ position()!.currentPrice | number:'1.2-4' }}</span>
        </div>
        <div>
          <span class="text-slate-600 dark:text-slate-400 block text-[10px] font-semibold">ALLOCATION</span>
          <span class="text-brand-600 dark:text-brand-400 font-bold">\${{ position()!.initialMargin | number:'1.2-2' }}</span>
        </div>
      </div>

      <!-- Take Profit Target -->
      <div>
        <label class="block text-xs font-semibold text-emerald-700 dark:text-emerald-400 mb-1 flex items-center justify-between">
          <span>Take Profit Price</span>
          @if (takeProfit) {
            <span class="text-[11px] font-mono text-emerald-700 dark:text-emerald-400">
              Target Gain: +\${{ calculatePotentialGain() | number:'1.2-2' }}
            </span>
          }
        </label>
        <div class="relative">
          <span class="absolute left-3 top-2.5 text-slate-500 font-bold">$</span>
          <input
            type="number"
            step="any"
            [(ngModel)]="takeProfit"
            placeholder="Target Exit Price"
            class="glass-input w-full pl-8 pr-3 py-2 rounded-xl text-sm font-mono text-slate-900 dark:text-white placeholder-slate-400"
          />
        </div>
      </div>

      <!-- Stop Loss Target -->
      <div>
        <label class="block text-xs font-semibold text-rose-700 dark:text-rose-400 mb-1 flex items-center justify-between">
          <span>Stop Loss Price</span>
          @if (stopLoss) {
            <span class="text-[11px] font-mono text-rose-700 dark:text-rose-400">
              Target Risk: -\${{ calculatePotentialLoss() | number:'1.2-2' }}
            </span>
          }
        </label>
        <div class="relative">
          <span class="absolute left-3 top-2.5 text-slate-500 font-bold">$</span>
          <input
            type="number"
            step="any"
            [(ngModel)]="stopLoss"
            placeholder="Stop Protection Price"
            class="glass-input w-full pl-8 pr-3 py-2 rounded-xl text-sm font-mono text-slate-900 dark:text-white placeholder-slate-400"
          />
        </div>
      </div>
    </div>
  }

  <div modal-actions class="flex gap-2">
    <app-glass-button variant="ghost" (clicked)="closed.emit()">
      Cancel
    </app-glass-button>
    <app-glass-button variant="primary" icon="fa-solid fa-check" (clicked)="confirmUpdate()">
      Update Stops
    </app-glass-button>
  </div>
</app-glass-modal>
