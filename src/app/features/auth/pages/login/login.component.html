<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
  <!-- Liquid Glass Container -->
  <div class="glass-card glass-specular w-full max-w-md p-8 sm:p-10 z-10 shadow-2xl relative">
    <!-- Theme Toggle inside Panel -->
    <div class="absolute top-5 right-5 z-20">
      <button
        type="button"
        (click)="theme.toggleDarkMode()"
        class="p-2 rounded-xl bg-slate-100/90 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 transition-all cursor-pointer shadow-xs"
        title="Toggle Dark/Light Mode"
      >
        <i [class]="theme.isDark() ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-moon text-slate-600'" class="text-sm"></i>
      </button>
    </div>
    <!-- Logo & Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-400 text-white shadow-glow-brand mb-4">
        <i class="fa-solid fa-chart-line text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        Welcome Back
      </h2>
      <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">
        Access your universal multi-asset trading workstation
      </p>
    </div>

    <!-- Google Single Sign-On Button (Google Identity Services) -->
    <div class="w-full flex flex-col items-center justify-center mb-6">
      <div #btn class="flex justify-center w-full min-h-[44px]"></div>
      @if (!isGoogleBtnLoaded()) {
        <button
          type="button"
          (click)="loginWithGoogle()"
          class="w-full py-2.5 px-4 rounded-xl border border-slate-300 dark:border-white/10 bg-slate-100 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 text-slate-800 dark:text-white font-medium text-xs flex items-center justify-center gap-3 backdrop-blur-md transition-all shadow-sm cursor-pointer mt-1"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          Continue with Google
        </button>
      }
    </div>

    <div class="relative flex items-center justify-center mb-6">
      <div class="border-t border-slate-200 dark:border-white/10 w-full"></div>
      <span class="bg-white dark:bg-slate-900/90 px-3 text-[11px] text-slate-500 uppercase tracking-widest font-semibold absolute">
        Or With Email
      </span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
          Email Address
        </label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-xs text-slate-400"></i>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            tabindex="1"
            required
            placeholder="trader@trackerpro.io"
            class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-xs placeholder-slate-400 text-slate-900 dark:text-white"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
          Password
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-xs text-slate-400"></i>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            tabindex="2"
            required
            placeholder="••••••••••••"
            class="glass-input w-full pl-9 pr-10 py-2.5 rounded-xl text-xs placeholder-slate-400 text-slate-900 dark:text-white"
          />
          <button
            type="button"
            tabindex="-1"
            (click)="showPassword.update(v => !v)"
            class="absolute right-3.5 top-3 text-xs text-slate-400 hover:text-slate-800 dark:hover:text-white cursor-pointer"
            title="Toggle password visibility"
          >
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            tabindex="3"
            class="rounded border-slate-300 dark:border-slate-700 text-brand-500 focus:ring-brand-500 cursor-pointer"
          />
          <span>Keep me signed in</span>
        </label>

        <a
          routerLink="/auth/forgot-password"
          tabindex="4"
          class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-500 transition-colors"
        >
          Forgot Password?
        </a>
      </div>

      <div class="pt-2">
        <app-glass-button
          type="submit"
          variant="primary"
          size="lg"
          tabindex="5"
          [fullWidth]="true"
          [loading]="isLoading()"
          [disabled]="!email || !password"
        >
          Sign In to Workstation
        </app-glass-button>
      </div>
    </form>

    <!-- Register Link -->
    <p class="text-center text-xs text-slate-600 dark:text-slate-400 mt-6">
      Don't have an account yet?
      <a routerLink="/auth/register" class="font-bold text-brand-600 dark:text-brand-400 hover:text-brand-500 ml-1">
        Create Free Account
      </a>
    </p>
  </div>
</div>
