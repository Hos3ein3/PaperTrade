<div class="min-h-screen flex items-center justify-center p-4">
  <div class="glass-card glass-specular w-full max-w-md p-8 sm:p-10 shadow-2xl relative">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-500/20 text-brand-600 dark:text-brand-400 border border-brand-500/30 mb-4">
        <i class="fa-solid fa-lock-open text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 dark:text-white">Create New Password</h2>
      <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">Please enter your new strong password</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">New Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
          placeholder="••••••••••••"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Confirm New Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
          placeholder="••••••••••••"
        />
      </div>

      <app-glass-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [loading]="isLoading()"
        [disabled]="!password || password !== confirmPassword"
      >
        Update Password
      </app-glass-button>
    </form>
  </div>
</div>
