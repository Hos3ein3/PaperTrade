<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
  <!-- Theme Toggle -->
  <div class="absolute top-5 right-5 z-20">
    <button
      type="button"
      (click)="theme.toggleDarkMode()"
      class="p-2 rounded-xl bg-slate-100/90 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 transition-all cursor-pointer shadow-xs"
      title="Toggle Dark/Light Mode"
    >
      <i [class]="theme.isDark() ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-moon text-slate-600'" class="text-sm"></i>
    </button>
  </div>

  <div class="glass-card glass-specular w-full max-w-md p-8 sm:p-10 z-10 shadow-2xl relative text-center">
    <!-- Google Logo -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-lg mb-6 border border-slate-100">
      <svg class="w-8 h-8" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
      </svg>
    </div>

    @if (isProcessing()) {
      <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">
        Authenticating with Google
      </h2>
      <p class="text-xs text-slate-600 dark:text-slate-400 mb-6">
        {{ authStatus() }}
      </p>

      <div class="flex items-center justify-center gap-2 py-4 text-brand-600 dark:text-brand-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
      </div>
    } @else {
      @if (errorMessage()) {
        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-rose-500/10 text-rose-500 mb-3">
          <i class="fa-solid fa-circle-exclamation text-xl"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-2">
          Authentication Notice
        </h2>
        <div class="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-700 dark:text-rose-300 text-xs text-left mb-6 leading-relaxed">
          {{ errorMessage() }}
        </div>

        <div class="space-y-3">
          <app-glass-button
            type="button"
            variant="primary"
            size="md"
            [fullWidth]="true"
            (click)="completeWithDemoGoogle()"
          >
            <i class="fa-solid fa-bolt mr-2"></i> Continue with Demo Google Session
          </app-glass-button>

          <a
            routerLink="/auth/login"
            class="block w-full py-2.5 px-4 rounded-xl border border-slate-300 dark:border-white/10 bg-slate-100 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 text-slate-700 dark:text-slate-300 text-xs font-semibold transition-all"
          >
            Back to Sign In
          </a>
        </div>
      }
    }
  </div>
</div>
