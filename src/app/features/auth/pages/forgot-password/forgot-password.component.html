<div class="min-h-screen flex items-center justify-center p-4">
  <div class="glass-card glass-specular w-full max-w-md p-8 sm:p-10 shadow-2xl relative">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-500/20 text-brand-600 dark:text-brand-400 border border-brand-500/30 mb-4">
        <i class="fa-solid fa-key text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 dark:text-white">Reset Password</h2>
      <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">Enter your account email to receive reset instructions</p>
    </div>

    @if (isSubmitted()) {
      <div class="p-4 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-800 dark:text-emerald-300 text-xs text-center space-y-2 mb-6">
        <i class="fa-solid fa-circle-check text-2xl text-emerald-500 dark:text-emerald-400"></i>
        <p class="font-bold">Reset Email Dispatched</p>
        <p class="text-[11px] text-slate-600 dark:text-slate-300">We have sent instructions to <b>{{ email }}</b>.</p>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="your.email@domain.com"
            class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
          />
        </div>

        <app-glass-button
          type="submit"
          variant="primary"
          [fullWidth]="true"
          size="lg"
          [loading]="isLoading()"
          [disabled]="!email"
        >
          Send Reset Link
        </app-glass-button>
      </form>
    }

    <p class="text-center text-xs text-slate-600 dark:text-slate-400 mt-6">
      Remembered your password?
      <a routerLink="/auth/login" class="font-bold text-brand-600 dark:text-brand-400 hover:text-brand-500 ml-1">
        Back to Sign In
      </a>
    </p>
  </div>
</div>
