<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
  <div class="glass-card glass-specular w-full max-w-md p-8 sm:p-10 z-10 shadow-2xl relative">
    <!-- Theme Toggle inside Panel -->
    <div class="absolute top-5 right-5 z-20">
      <button
        type="button"
        (click)="theme.toggleDarkMode()"
        class="p-2 rounded-xl bg-slate-100/90 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 transition-all cursor-pointer shadow-xs"
        title="Toggle Dark/Light Mode"
      >
        <i [class]="theme.isDark() ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-moon text-slate-600'" class="text-sm"></i>
      </button>
    </div>
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-400 text-white shadow-glow-brand mb-4">
        <i class="fa-solid fa-user-plus text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        Create Trader Account
      </h2>
      <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">
        Instant paper trading account with $50,000 virtual capital
      </p>
    </div>

    <!-- Google Registration Button (Direct Google OAuth Redirect) -->
    <button
      type="button"
      (click)="registerWithGoogle()"
      class="w-full py-2.5 px-4 rounded-xl border border-slate-300 dark:border-white/10 bg-slate-100 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 text-slate-800 dark:text-white font-medium text-xs flex items-center justify-center gap-3 backdrop-blur-md transition-all mb-5 shadow-sm cursor-pointer"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
      </svg>
      Register with Google
    </button>

    <div class="relative flex items-center justify-center mb-5">
      <div class="border-t border-slate-200 dark:border-white/10 w-full"></div>
      <span class="bg-white dark:bg-slate-900/90 px-3 text-[11px] text-slate-500 uppercase tracking-widest font-semibold absolute">
        Or Register With Email
      </span>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          tabindex="1"
          required
          placeholder="Alex Vance"
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          tabindex="2"
          required
          placeholder="alex@domain.com"
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          tabindex="3"
          required
          placeholder="At least 8 characters"
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          tabindex="4"
          required
          placeholder="Confirm password"
          class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400"
        />
      </div>

      <div class="pt-2">
        <app-glass-button
          type="submit"
          variant="primary"
          size="lg"
          tabindex="5"
          [fullWidth]="true"
          [loading]="isLoading()"
          [disabled]="!name || !email || !password || password !== confirmPassword"
        >
          Complete Registration
        </app-glass-button>
      </div>
    </form>

    <p class="text-center text-xs text-slate-600 dark:text-slate-400 mt-5">
      Already have an account?
      <a routerLink="/auth/login" class="font-bold text-brand-600 dark:text-brand-400 hover:text-brand-500 ml-1">
        Sign In Here
      </a>
    </p>
  </div>
</div>
