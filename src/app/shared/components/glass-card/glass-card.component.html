<div
  class="glass-card glass-specular relative flex flex-col w-full"
  [ngClass]="[
    paddingClass(),
    interactive() ? 'cursor-pointer hover:border-brand-500/40' : '',
    customClass()
  ]"
>
  @if (title() || subtitle()) {
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200/80 dark:border-white/10">
      <div>
        @if (title()) {
          <h3 class="text-base font-semibold tracking-tight text-slate-900 dark:text-slate-100 flex items-center gap-2">
            @if (icon()) {
              <i [class]="icon()" class="text-brand-500"></i>
            }
            {{ title() }}
          </h3>
        }
        @if (subtitle()) {
          <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5">{{ subtitle() }}</p>
        }
      </div>
      <div class="flex items-center gap-2">
        <ng-content select="[card-action]"></ng-content>
      </div>
    </div>
  }

  <div class="flex-1 w-full">
    <ng-content></ng-content>
  </div>
</div>
