<div
  role="checkbox"
  [attr.aria-checked]="indeterminate() ? 'mixed' : checked()"
  [attr.aria-disabled]="isDisabled"
  [tabindex]="isDisabled ? -1 : 0"
  (click)="toggle($event)"
  (keydown)="onKeyDown($event)"
  class="group inline-flex items-start gap-2.5 transition-all select-none outline-none focus-visible:ring-2 focus-visible:ring-brand-500/50 rounded-lg"
  [class.cursor-pointer]="!isDisabled"
  [class.cursor-not-allowed]="isDisabled"
  [class.opacity-50]="isDisabled"
>
  <!-- Checkbox Box Indicator -->
  <div
    class="relative shrink-0 flex items-center justify-center border transition-all duration-200 mt-0.5"
    [ngClass]="[boxSizeClass(), checkedClass()]"
  >
    @if (indeterminate()) {
      <i class="fa-solid fa-minus transition-transform duration-150 transform scale-100"></i>
    } @else if (checked()) {
      <i class="fa-solid fa-check transition-transform duration-150 transform scale-100"></i>
    }
  </div>

  <!-- Label and Description -->
  <div class="flex flex-col text-left">
    @if (label()) {
      <span
        class="text-xs font-semibold text-slate-800 dark:text-slate-200 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"
      >
        {{ label() }}
      </span>
    }
    @if (description()) {
      <span class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight mt-0.5">
        {{ description() }}
      </span>
    }
    <ng-content></ng-content>
  </div>
</div>
