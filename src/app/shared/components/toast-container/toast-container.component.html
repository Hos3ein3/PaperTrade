<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none p-2 sm:p-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-xl border shadow-xl backdrop-blur-2xl transition-all duration-300 animate-slide-in"
      [ngClass]="toastClasses(toast.type)"
    >
      <div class="text-lg mt-0.5" [ngClass]="iconColor(toast.type)">
        <i [class]="toastIcon(toast.type)"></i>
      </div>

      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-semibold text-slate-900 dark:text-white tracking-tight">{{ toast.title }}</h4>
        <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5 leading-relaxed break-words">{{ toast.message }}</p>
      </div>

      <button
        type="button"
        (click)="dismiss($event, toast.id)"
        class="cursor-pointer relative z-20 w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-white/10 transition-colors p-1 -mr-1 -mt-1"
        aria-label="Dismiss notification"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  }
</div>
