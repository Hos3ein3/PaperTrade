@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <!-- Backdrop Blur -->
    <div
      class="fixed inset-0 bg-slate-950/70 backdrop-blur-md transition-opacity duration-300"
      (click)="closeOnBackdrop() && closed.emit()"
    ></div>

    <!-- Glass Dialog Container -->
    <div
      class="relative w-full max-w-lg mx-auto bg-white/95 dark:bg-slate-900/90 text-slate-800 dark:text-slate-100 backdrop-blur-2xl border border-slate-200/90 dark:border-white/15 rounded-2xl shadow-2xl p-6 z-10 transform transition-all duration-300 scale-100"
      [ngClass]="maxWidthClass()"
    >
      <!-- Specular Highlight Top Edge -->
      <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-brand-400/50 to-transparent"></div>

      <!-- Header -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-200/80 dark:border-white/10 mb-5">
        <div class="flex items-center gap-3">
          @if (icon()) {
            <div class="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-600 dark:text-brand-400 border border-brand-500/30 flex items-center justify-center">
              <i [class]="icon()" class="text-lg"></i>
            </div>
          }
          <div>
            <h3 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">{{ title() }}</h3>
            @if (subtitle()) {
              <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5">{{ subtitle() }}</p>
            }
          </div>
        </div>

        <button
          type="button"
          (click)="closed.emit()"
          class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-white/10 transition-colors"
        >
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Content Body -->
      <div class="space-y-4">
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer (Optional Actions) -->
      <div class="mt-6 pt-4 border-t border-slate-200/80 dark:border-white/10 flex justify-end gap-3">
        <ng-content select="[modal-actions]"></ng-content>
      </div>
    </div>
  </div>
}
