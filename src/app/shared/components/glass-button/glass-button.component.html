<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  (click)="clicked.emit($event)"
  class="relative inline-flex items-center justify-center font-medium transition-all duration-200 select-none overflow-hidden rounded-xl border focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:pointer-events-none active:scale-[0.98]"
  [ngClass]="[variantClasses(), sizeClasses(), fullWidth() ? 'w-full' : '']"
>
  @if (loading()) {
    <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>
  } @else if (icon()) {
    <i [class]="icon()" class="mr-2 text-current"></i>
  }
  <ng-content></ng-content>
</button>
