@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-[9990] flex items-center justify-center bg-slate-950/60 backdrop-blur-md transition-all animate-in fade-in duration-200"
    (click)="onCancel($event)"
  >
    <div
      class="glass-card glass-specular p-6 sm:p-8 rounded-2xl max-w-xs sm:max-w-sm w-full mx-4 shadow-2xl border border-white/20 dark:border-white/10 flex flex-col items-center text-center space-y-4"
      (click)="$event.stopPropagation()"
    >
      <!-- Ambient Liquid Pulse Ring -->
      <div class="relative w-16 h-16 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full border-2 border-brand-500/20 animate-ping"></div>
        <div class="w-14 h-14 rounded-full border-3 border-transparent border-t-brand-500 border-r-cyan-400 animate-spin"></div>
        <div class="absolute w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center text-white shadow-glow-brand">
          <i class="fa-solid fa-chart-line text-sm"></i>
        </div>
      </div>

      <!-- Text Details -->
      <div class="space-y-1">
        <h3 class="text-sm font-black text-slate-900 dark:text-white tracking-tight">Processing Market Request</h3>
        <p class="text-xs text-slate-600 dark:text-slate-400">Communicating with exchange engine & services...</p>
      </div>

      <!-- Cancel Button -->
      <button
        type="button"
        (click)="onCancel($event)"
        class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 hover:text-rose-600 dark:hover:text-rose-400 bg-slate-100 hover:bg-rose-50 dark:bg-white/5 dark:hover:bg-rose-950/40 border border-slate-300 dark:border-white/10 hover:border-rose-300 dark:hover:border-rose-800/50 transition-all flex items-center gap-2 cursor-pointer shadow-sm active:scale-95"
      >
        <i class="fa-solid fa-circle-xmark text-xs text-rose-500"></i>
        <span>Cancel Request</span>
      </button>
    </div>
  </div>
}
